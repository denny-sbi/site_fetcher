name: Data Fetcher Build and Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      packages: write  # Needed to push to ghcr.io
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create telemetry-net network
      run: docker network create telemetry-net || echo "Network already exists"
      
    - name: Build with Docker Compose
      run: docker compose build
    
    - name: Tag the image
      run: docker tag your_service_name ghcr.io/${{ github.repository_owner }}/data-fetcher:latest
    
    - name: Push the image
      run: docker push ghcr.io/${{ github.repository_owner }}/data-fetcher:latest
